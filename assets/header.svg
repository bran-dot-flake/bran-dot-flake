<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-label="Brandon Chaney">
<title>Brandon Chaney</title><style>text{font-family:Segoe UI,Arial,sans-serif}.sweep{animation:sweep 12s linear infinite}@keyframes sweep{from{stroke-dashoffset:var(--distance)}to{stroke-dashoffset:0}}.wave{animation:wave 16s ease-in-out infinite alternate;transform-origin:center}.wave2{animation:wave 22s ease-in-out infinite alternate-reverse;transform-origin:center}@keyframes wave{from{transform:translateX(-25px) scaleY(.92)}to{transform:translateX(25px) scaleY(1.08)}}.pulse{animation:pulse 5s ease-in-out infinite}.flow{stroke-dasharray:4 9;animation:flow 24s linear infinite}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-130}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="sky"><stop stop-color="#0d131d"/><stop offset=".5" stop-color="#193848"/><stop offset="1" stop-color="#225969"/></linearGradient><clipPath id="banner"><rect width="900" height="150" rx="14"/></clipPath></defs><g clip-path="url(#banner)"><rect width="900" height="150" fill="url(#sky)"/><path class="wave2" d="M-70 124 Q150 82 420 121 T970 103 V170 H-70Z" fill="#7392db" opacity=".14"/><path class="wave" d="M-70 126 Q210 158 500 117 T970 133 V180 H-70Z" fill="#0d1117" opacity=".9"/></g><text x="450" y="86" font-size="38" fill="#f0f5fc" font-weight="650" text-anchor="middle">Brandon Chaney</text></svg>