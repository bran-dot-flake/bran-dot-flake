<title>Splunk, Sentinel, Wireshark, Sysmon, Wazuh, Shuffle and TheHive</title><style>text{font-family:Segoe UI,Arial,sans-serif}.sweep{animation:sweep 12s linear infinite}@keyframes sweep{from{stroke-dashoffset:var(--distance)}to{stroke-dashoffset:0}}.wave{animation:wave 16s ease-in-out infinite alternate;transform-origin:center}.wave2{animation:wave 22s ease-in-out infinite alternate-reverse;transform-origin:center}@keyframes wave{from{transform:translateX(-25px) scaleY(.92)}to{transform:translateX(25px) scaleY(1.08)}}.pulse{animation:pulse 5s ease-in-out infinite}.flow{stroke-dasharray:4 9;animation:flow 24s linear infinite}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-130}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0" y="1" width="88" height="28" rx="0" fill="#155f71" stroke="none"/><rect x="0" y="1" width="24" height="28" rx="0" fill="#223044" stroke="none"/><text x="12" y="20" font-size="18" fill="#edf3fb" font-weight="700" text-anchor="middle">›</text><text x="31" y="20" font-size="13" fill="#fff" font-weight="600" text-anchor="start">Splunk</text><rect x="96" y="1" width="104" height="28" rx="0" fill="#006dba" stroke="none"/><rect x="96" y="1" width="24" height="28" rx="0" fill="#223044" stroke="none"/><text x="108" y="20" font-size="18" fill="#edf3fb" font-weight="700" text-anchor="middle">›</text><text x="127" y="20" font-size="13" fill="#fff" font-weight="600" text-anchor="start">Sentinel</text><rect x="208" y="1" width="112" height="28" rx="0" fill="#245bb0" stroke="none"/><rect x="208" y="1" width="24" height="28" rx="0" fill="#223044" stroke="none"/><text x="220" y="20" font-size="18" fill="#edf3fb" font-weight="700" text-anchor="middle">›</text><text x="239" y="20" font-size="13" fill="#fff" font-weight="600" text-anchor="start">Wireshark</text><rect x="328" y="1" width="88" height="28" rx="0" fill="#7252ac" stroke="none"/><rect x="328" y="1" width="24" height="28" rx="0" fill="#223044" stroke="none"/><text x="340" y="20" font-size="18" fill="#edf3fb" font-weight="700" text-anchor="middle">›</text><text x="359" y="20" font-size="13" fill="#fff" font-weight="600" text-anchor="start">Sysmon</text><rect x="424" y="1" width="80" height="28" rx="0" fill="#258446" stroke="none"/><rect x="424" y="1" width="24" height="28" rx="0" fill="#223044" stroke="none"/><text x="436" y="20" font-size="18" fill="#edf3fb" font-weight="700" text-anchor="middle">›</text><text x="455" y="20" font-size="13" fill="#fff" font-weight="600" text-anchor="start">Wazuh</text><rect x="512" y="1" width="96" height="28" rx="0" fill="#b55638" stroke="none"/><rect x="512" y="1" width="24" height="28" rx="0" fill="#223044" stroke="none"/><text x="524" y="20" font-size="18" fill="#edf3fb" font-weight="700" text-anchor="middle">›</text><text x="543" y="20" font-size="13" fill="#fff" font-weight="600" text-anchor="start">Shuffle</text><rect x="616" y="1" width="96" height="28" rx="0" fill="#8e6919" stroke="none"/><rect x="616" y="1" width="24" height="28" rx="0" fill="#223044" stroke="none"/><text x="628" y="20" font-size="18" fill="#edf3fb" font-weight="700" text-anchor="middle">›</text><text x="647" y="20" font-size="13" fill="#fff" font-weight="600" text-anchor="start">TheHive</text></svg>