name: Refresh profile dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * *'
  push:
    branches: [main]
    paths: ['config.json', 'scripts/**', '.github/workflows/dashboard.yml']
permissions:
  contents: write
concurrency:
  group: profile-dashboard
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install code counter
        run: sudo apt-get update && sudo apt-get install -y cloc
      - name: Measure repositories and render assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update.py
      - name: Commit updated dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets data
          if git diff --cached --quiet; then
            echo 'No dashboard changes'
          else
            git commit -m 'Refresh profile dashboard'
            git push
          fi
